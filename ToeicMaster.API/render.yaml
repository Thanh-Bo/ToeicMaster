services:
  - type: web
    name: toeicmaster-api
    runtime: dotnet
    region: singapore
    plan: starter
    buildCommand: dotnet publish -c Release -o out
    startCommand: dotnet out/ToeicMaster.API.dll
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:${PORT}
    autoDeploy: false
