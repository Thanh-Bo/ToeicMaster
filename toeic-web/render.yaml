services:
  - type: web
    name: toeicmaster-web
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://api.toeicmasters.com
      - key: NODE_ENV
        value: production
    autoDeploy: false
