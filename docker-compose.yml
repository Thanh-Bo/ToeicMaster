services:
  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # .NET API (uses Azure SQL database, Redis for caching)
  api:
    build:
      context: ./ToeicMaster.API
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Redis__ConnectionString=redis:6379
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./ToeicMaster.API:/app

  # Next.js Web App
  web:
    build:
      context: ./toeic-web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api:5000
    depends_on:
      - api
    volumes:
      - ./toeic-web:/app

volumes:
  redis_data:
